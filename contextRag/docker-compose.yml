version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: rag_db
    ports:
      - '127.0.0.1:5433:5432'

  qdrant:
    image: qdrant/qdrant:latest
    ports:
        - '127.0.0.1:6333:6333'

  redis:
    image: redis:7-alpine
    ports:
        - '127.0.0.1:6380:6379'

name: ContextRag CI/CD Pipeline

on:
  push:
    branches: [ main, master, "release/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  node-lint-and-test:
    name: Node.js Lint, Build & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Validation (tsc --noEmit)
        run: npm run lint

      - name: Frontend & Backend Production Build
        run: npm run build

      - name: Run Phase 2 Security Gate Tests
        run: npx tsx tests/phase2_security_gate.ts

      - name: Run Embedding Cache & Batching Tests
        run: npx tsx tests/test_embedding_cache.ts

      - name: Run RAG Retrieval Optimization Tests
        run: npx tsx tests/test_rag_retrieval_evaluation.ts

      - name: Run Provider Fallback & Safe Streaming Tests
        run: npx tsx tests/test_provider_fallback_streaming.ts

      - name: Run In-Process HTTP Security & Authorization Suite
        run: npx tsx tests/http_security_integration.ts

  python-tests:
    name: Python FastAPI & Document AI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contextRag/requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 contextRag/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 contextRag/app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Python Unit Tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long
          DATABASE_URL: sqlite:///./test_ci.db
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest contextRag/tests/unit/test_auth_service.py contextRag/tests/unit/test_llm_secret_handling.py contextRag/tests/unit/test_retrieval_metrics.py -v

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [node-lint-and-test, python-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node Core Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: contextrag-node:test

      - name: Build Python Document AI Image
        uses: docker/build-push-action@v5
        with:
          context: ./contextRag
          file: ./contextRag/Dockerfile
          push: false
          tags: contextrag-python:test
